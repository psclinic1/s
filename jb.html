<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PSCLINIC - CONSOLE JB</title>
    <style>
      :root {
        --bg-main: #05070a;
        --card-bg: rgba(18, 24, 38, 0.85);
        --neon-green: #00ff88;
        --neon-glow: rgba(0, 255, 136, 0.3);
        --neon-red: #ff3366;
        --text-primary: #ffffff;
        --text-secondary: #8b9bb4;
        --border-neon: rgba(0, 255, 136, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: var(--bg-main);
        background-image: 
          radial-gradient(circle at 50% 30%, rgba(0, 255, 136, 0.05) 0%, transparent 70%),
          linear-gradient(to bottom, #080c14, #030508);
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }

      /* شريط العنوان العلوي */
      #brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px 20px;
        background: rgba(10, 14, 22, 0.9);
        border-bottom: 1px solid var(--border-neon);
        backdrop-filter: blur(10px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      }

      #brand img {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 2px solid var(--neon-green);
        box-shadow: 0 0 10px var(--neon-glow);
      }

      #brand b {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 3px;
        color: var(--neon-green);
        text-shadow: 0 0 10px var(--neon-glow);
      }

      /* المؤشر الدوار */
      #spin {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 64px;
        height: 64px;
        margin: -32px 0 0 -32px;
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-top: 3px solid var(--neon-green);
        border-right: 3px solid var(--neon-green);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        filter: drop-shadow(0 0 12px var(--neon-green));
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* رسالة الخطأ */
      #msg {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        color: var(--neon-red);
        background: rgba(20, 10, 15, 0.95);
        padding: 20px 36px;
        border: 1px solid var(--neon-red);
        border-radius: 12px;
        box-shadow: 0 0 30px rgba(255, 51, 102, 0.3);
        backdrop-filter: blur(8px);
        display: none;
        letter-spacing: 1px;
      }

      #wrap {
        padding: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      #state, #out {
        display: none;
      }

      /* حالات العرض */
      body.done #spin,
      body.fail #spin {
        display: none;
      }

      body.fail #msg {
        display: block;
      }

      /* وضعية السجل (?log=1) */
      body.log #spin,
      body.log #msg {
        display: none;
      }

      body.log #wrap {
        padding: 20px;
      }

      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--neon-green);
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.6;
        background: var(--card-bg);
        border: 1px solid var(--border-neon);
        border-radius: 10px;
        padding: 16px;
        height: calc(100vh - 130px);
        overflow-y: auto;
        box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      }

      /* ألوان مخرجات السجل */
      .ok, .safe { color: #00ff88; }
      .bad, .danger { color: #ff3366; }
      .warn { color: #ffcc00; }
      code { color: #00e5ff; }
    </style>
  </head>

</html>
